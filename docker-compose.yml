services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Define KEYCLOAK_ADMIN_USERNAME in .env.keycloak}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD in .env.keycloak}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/eventsecure-realm.json:/opt/keycloak/data/import/eventsecure-realm.json:ro
    restart: unless-stopped

volumes:
  keycloak_data:
